<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مناسبات الكويت – تطبيق مناسبات وأفراح القبائل والعوائل</title>
<meta name="description" content="مناسبات الكويت – المنصة الأولى في دولة الكويت لتنظيم وتوثيق ومتابعة مناسبات القبائل والعوائل مع رزنامة ذكية ودليل المأذونين والخدمات.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f8fafc; --bg2:#ffffff; --text:#0f1b2d; --muted:#5b6678; --card:#ffffff; --line:#e2e8f0;
    --accent:#1445a0; --accent2:#1e40af; --gold:#F4B942; --gold2:#e5a835;
    --glow:rgba(20,69,160,.16); --glow-gold:rgba(244,185,66,.28);
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#070e1c; --bg2:#0c1830; --text:#f1f5f9; --muted:#94a3b8; --card:#102040; --line:#1c3258;
      --accent:#2563eb; --accent2:#3b82f6; --gold:#F4B942; --gold2:#f5b041;
      --glow:rgba(37,99,235,.22); --glow-gold:rgba(244,185,66,.32);
    }
  }
  :root[data-theme="dark"]{
    --bg:#070e1c; --bg2:#0c1830; --text:#f1f5f9; --muted:#94a3b8; --card:#102040; --line:#1c3258;
    --accent:#2563eb; --accent2:#3b82f6; --gold:#F4B942; --gold2:#f5b041;
    --glow:rgba(37,99,235,.22); --glow-gold:rgba(244,185,66,.32);
  }
  html{scroll-behavior:smooth; scroll-padding-top:calc(env(safe-area-inset-top,0px) + 95px)}
  *{box-sizing:border-box;margin:0}
  body{
    font-family:'Tajawal',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;
    background:var(--bg); color:var(--text); overflow-x:hidden; line-height:1.6;
  }
  a{color:inherit}
  .wrap{width:100%; max-width:1160px; margin:0 auto; padding:0 clamp(18px,5vw,40px)}

  /* Golden text utility */
  .gold-text{
    color: var(--gold) !important;
  }

  /* Entrance / Scroll Reveal Animation */
  .reveal {
    opacity: 0;
    transform: translateY(32px);
    transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1), transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    will-change: opacity, transform;
  }
  .reveal.revealed {
    opacity: 1;
    transform: translateY(0);
  }
  .reveal-scale {
    opacity: 0;
    transform: scale(0.96) translateY(24px);
    transition: opacity 0.85s cubic-bezier(0.16, 1, 0.3, 1), transform 0.85s cubic-bezier(0.16, 1, 0.3, 1);
    will-change: opacity, transform;
  }
  .reveal-scale.revealed {
    opacity: 1;
    transform: scale(1) translateY(0);
  }
  .reveal-delay-1 { transition-delay: 0.1s; }
  .reveal-delay-2 { transition-delay: 0.2s; }
  .reveal-delay-3 { transition-delay: 0.3s; }
  .reveal-delay-4 { transition-delay: 0.4s; }
  .reveal-delay-5 { transition-delay: 0.5s; }
  .reveal-delay-6 { transition-delay: 0.6s; }

  /* header */
  header{
    position:sticky; top:env(safe-area-inset-top,0px); z-index:50;
    background:color-mix(in srgb, var(--bg) 85%, transparent);
    backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    border-bottom:1px solid var(--line);
    transition:background .2s, border-color .2s;
  }
  .nav{
    display:flex; align-items:center; justify-content:space-between;
    height:96px; gap:20px;
  }
  
  /* Brand on the right (in RTL) - Prominently Enlarged */
  .brand{
    display:inline-flex; align-items:center; gap:16px;
    text-decoration:none; font-weight:800; flex:none;
  }
  .brand-logo{
    width:76px; height:76px; border-radius:18px;
    object-fit:cover; box-shadow:0 6px 18px var(--glow);
    border:2px solid rgba(244,185,66,.35); flex:none;
    transition:transform .2s ease, border-color .2s ease;
  }
  .brand:hover .brand-logo{
    transform:scale(1.04);
    border-color:var(--gold);
  }
  .brand-text{
    font-size:1.45rem; font-weight:800; color:var(--text);
    letter-spacing:-0.01em; display:flex; align-items:center; gap:6px;
  }

  nav.links{display:flex; gap:28px; font-weight:600; color:var(--muted)}
  nav.links a{text-decoration:none; transition:color .15s}
  nav.links a:hover{color:var(--accent)}

  .actions{display:flex; align-items:center; gap:12px; flex:none}
  .lang{
    border:1px solid var(--line); background:var(--card); color:var(--text);
    padding:9px 18px; border-radius:999px; font:inherit; font-weight:700; font-size:.88rem; cursor:pointer;
    transition:border-color .15s, background .15s;
  }
  .lang:hover{border-color:var(--gold)}
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#fff; text-decoration:none;
    padding:11px 26px; border-radius:999px; font-weight:800; font-size:.95rem; border:0; cursor:pointer;
    box-shadow:0 8px 20px var(--glow); transition:transform .15s, box-shadow .15s;
  }
  .btn:hover{transform:translateY(-2px); box-shadow:0 12px 26px var(--glow)}

  /* hero (Centered & responsive across all screens) */
  .hero{
    padding:clamp(54px,8vw,105px) 0 clamp(44px,7vw,86px);
    background-image:radial-gradient(60% 65% at 50% 15%, var(--glow), transparent 70%);
    text-align:center;
  }
  .hero .wrap{
    display:flex; justify-content:center; align-items:center;
  }
  .hero-content{
    max-width:880px; width:100%; margin:0 auto;
    display:flex; flex-direction:column; align-items:center; text-align:center;
  }
  
  h1{
    font-size:clamp(2.2rem, 5.4vw, 3.85rem);
    line-height:1.24; font-weight:800;
    max-width:24ch; margin:0 auto; text-align:center;
    letter-spacing:-0.02em;
  }
  h1 .title-sub{
    display:block; margin-top:8px;
    color:var(--gold);
    text-shadow:0 0 24px var(--glow-gold);
  }
  .lead{
    color:var(--muted); font-size:clamp(1.05rem, 2.2vw, 1.25rem);
    margin:22px auto 0; max-width:54ch; line-height:1.8; text-align:center;
  }
  
  .stores{
    display:flex; flex-wrap:wrap; gap:14px; margin-top:34px; justify-content:center;
  }
  .store{
    display:flex; align-items:center; gap:12px; direction:ltr;
    background:#0b1329; color:#fff; text-decoration:none;
    padding:10px 22px 10px 16px; border-radius:14px; min-width:180px;
    border:1px solid #1c2b50; transition:transform .15s, box-shadow .15s, border-color .15s;
    cursor:default;
  }
  .store:hover{
    transform:translateY(-2px); box-shadow:0 12px 28px rgba(0,0,0,.35);
    border-color:var(--gold);
  }
  .store svg{width:28px;height:28px;flex:none;fill:#fff}
  .store small{display:block;font-size:.68rem;opacity:.85;letter-spacing:.02em;line-height:1.2}
  .store b{display:block;font-size:1.15rem;font-weight:700;line-height:1.2;font-family:system-ui,-apple-system,'Segoe UI',sans-serif}

  /* Hero highlights bar */
  .hero-badges{
    display:flex; flex-wrap:wrap; justify-content:center; align-items:center;
    gap:clamp(14px, 3.5vw, 32px);
    margin-top:44px; padding-top:32px;
    border-top:1px solid var(--line);
    width:100%; max-width:760px;
  }
  .h-badge{
    display:inline-flex; align-items:center; gap:9px;
    font-size:clamp(.88rem, 1.9vw, .98rem); font-weight:600; color:var(--text);
  }
  .h-badge-dot{
    width:9px; height:9px; border-radius:50%;
    background:var(--gold); box-shadow:0 0 10px var(--gold);
    flex:none;
  }

  /* sections */
  section.block{padding:clamp(50px,7vw,88px) 0}
  section.alt{background:var(--bg2); border-block:1px solid var(--line)}
  .head{text-align:center; max-width:700px; margin:0 auto 46px}
  .head h2{font-size:clamp(1.7rem,4vw,2.4rem); font-weight:800; line-height:1.3}
  .head p{color:var(--muted); margin-top:10px; font-size:1.05rem}

  .grid{display:grid; grid-template-columns:repeat(3,1fr); gap:20px}
  .card{
    background:var(--card); border:1px solid var(--line); border-radius:22px; padding:28px 24px;
    transition:transform .25s, box-shadow .25s, border-color .25s;
  }
  .card:hover{
    transform:translateY(-4px); border-color:var(--gold);
    box-shadow:0 14px 32px -12px var(--glow-gold);
  }
  .ico{
    width:52px; height:52px; border-radius:16px; display:grid; place-items:center; margin-bottom:18px;
    background:color-mix(in srgb, var(--accent) 8%, transparent); color:var(--accent);
    border:1px solid color-mix(in srgb, var(--gold) 35%, transparent);
    transition:background .2s, color .2s, transform .2s;
  }
  .card:hover .ico{
    background:color-mix(in srgb, var(--gold) 15%, transparent);
    color:var(--gold); border-color:var(--gold); transform:scale(1.05);
  }
  .ico svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .card h3{font-size:1.2rem; font-weight:800; margin-bottom:8px}
  .card p{color:var(--muted); font-size:.95rem; line-height:1.65}

  .steps{display:grid; grid-template-columns:repeat(3,1fr); gap:24px; counter-reset:s}
  .step{
    text-align:center; padding:20px 18px;
    background:var(--card); border:1px solid var(--line); border-radius:20px;
    transition:border-color .25s, transform .25s;
  }
  .step:hover{border-color:var(--gold); transform:translateY(-3px)}
  .num{
    width:56px; height:56px; border-radius:50%; margin:0 auto 16px; display:grid; place-items:center;
    background:linear-gradient(135deg,var(--accent),var(--gold)); color:#fff; font-weight:800; font-size:1.3rem;
    box-shadow:0 8px 20px var(--glow-gold);
  }
  .step h3{font-weight:800; font-size:1.2rem; margin-bottom:8px}
  .step p{color:var(--muted); font-size:.95rem; line-height:1.6}

  /* CTA / Download banner */
  .cta{
    border-radius:28px; padding:clamp(32px,6vw,56px);
    background:linear-gradient(135deg,#091730,#112750); color:#fff; position:relative; overflow:hidden;
    text-align:center; display:flex; flex-direction:column; align-items:center;
    border:1px solid rgba(244,185,66,.2);
    box-shadow:0 24px 60px -15px rgba(0,0,0,.5);
  }
  .cta::before{
    content:""; position:absolute; inset-inline-start:-60px; top:-60px; width:280px; height:280px; border-radius:50%;
    background:radial-gradient(circle,rgba(244,185,66,.28),transparent 70%);
  }
  .cta::after{
    content:""; position:absolute; inset-inline-end:-60px; bottom:-60px; width:260px; height:260px; border-radius:50%;
    background:radial-gradient(circle,rgba(20,69,160,.4),transparent 70%);
  }
  .cta > *{position:relative; z-index:2}
  .cta h2{font-size:clamp(1.8rem,4.5vw,2.5rem); font-weight:800; line-height:1.3}
  .cta p{opacity:.9; margin-top:12px; font-size:1.1rem; max-width:48ch}
  .cta .stores{justify-content:center; margin-top:28px}

  footer{padding:32px 0 38px}
  .foot{
    display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap;
    color:var(--muted); font-size:.92rem;
  }
  .foot-links{display:flex; gap:20px}
  .foot a{text-decoration:none; font-weight:600; transition:color .15s}
  .foot a:hover{color:var(--gold)}

  /* Responsive Breakpoints */
  @media (max-width:900px){
    .nav{height:88px}
    .brand-logo{width:66px; height:66px; border-radius:16px}
    .brand-text{font-size:1.3rem}
    nav.links{display:none}
    .grid{grid-template-columns:repeat(2,1fr)}
    .steps{grid-template-columns:1fr}
  }
  @media (max-width:640px){
    .nav{height:80px}
    .brand-logo{width:56px; height:56px; border-radius:14px}
    .brand-text{font-size:1.16rem}
    .btn{padding:8px 18px; font-size:.88rem}
    .lang{padding:7px 12px; font-size:.8rem}
    .grid{grid-template-columns:1fr}
    .hero-badges{flex-direction:column; gap:10px}
    .foot{justify-content:center; text-align:center}
  }
  @media (max-width:420px){
    .nav{height:76px; gap:10px}
    .brand-logo{width:48px; height:48px; border-radius:12px}
    .brand-text{font-size:1.02rem}
    .btn{padding:7px 14px; font-size:.82rem}
  }
</style>
</head>
<body>

<header>
  <div class="wrap nav">
    <!-- Brand on the right in RTL with Enlarged Logo -->
    <a href="#top" class="brand" aria-label="مناسبات الكويت">
      <img id="logoImg" class="brand-logo" alt="مناسبات الكويت" src="./logo.jpg">
      <span class="brand-text">
        <span data-i18n="brand">مناسبات الكويت</span>
      </span>
    </a>

    <!-- Center Navigation Links -->
    <nav class="links">
      <a href="#features" data-i18n="nav1"></a>
      <a href="#how" data-i18n="nav2"></a>
      <a href="#download" data-i18n="nav3"></a>
    </nav>

    <!-- Left Actions (in RTL) -->
    <div class="actions">
      <button class="lang" id="langBtn" type="button">EN</button>
      <a class="btn" href="#download" data-i18n="navBtn"></a>
    </div>
  </div>
</header>

<main id="top">
  <!-- Hero Section -->
  <section class="hero">
    <div class="wrap">
      <div class="hero-content">
        <h1 class="reveal-scale" data-i18n-html="title"></h1>
        <p class="lead reveal reveal-delay-1" data-i18n="lead"></p>

        <!-- Download Buttons (Clean, without external links) -->
        <div class="stores reveal reveal-delay-2">
          <a class="store" data-store="ios" href="#">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16.37 1.43c0 1.14-.42 2.2-1.13 2.98-.76.84-2 1.49-3.02 1.4-.13-1.1.4-2.24 1.08-2.97.76-.82 2.05-1.43 3.07-1.41zM20.5 17.3c-.55 1.27-.82 1.84-1.53 2.96-1 1.56-2.4 3.5-4.14 3.51-1.55.02-1.95-1.01-4.05-1-2.1.01-2.54 1.02-4.09 1-1.74-.02-3.07-1.77-4.07-3.33C-.2 16.1-.5 11.02 1.3 8.27c1.28-1.95 3.3-3.09 5.2-3.09 1.93 0 3.14 1.06 4.74 1.06 1.55 0 2.5-1.06 4.73-1.06 1.69 0 3.48.92 4.76 2.5-4.18 2.29-3.5 8.26.77 9.62z"/></svg>
            <span><small>Download on the</small><b>App Store</b></span>
          </a>
          <a class="store" data-store="android" href="#">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path fill="#00c3ff" d="M3.6 1.6 14 12 3.6 22.4c-.3-.3-.5-.8-.5-1.4V3c0-.6.2-1.1.5-1.4z"/>
              <path fill="#00e676" d="M3.6 1.6c.4-.2 1-.1 1.6.3L17.4 8.6 14 12z"/>
              <path fill="#ffc400" d="m17.4 8.6 3.6 2c.9.5.9 2.3 0 2.8l-3.6 2L14 12z"/>

        </div>

        <!-- Trust Badges Bar -->
        <div class="hero-badges reveal reveal-delay-3">
          <div class="h-badge">
            <span class="h-badge-dot"></span>
            <span data-i18n="b1"></span>
          </div>
          <div class="h-badge">
            <span class="h-badge-dot"></span>
            <span data-i18n="b2"></span>
          </div>
          <div class="h-badge">
            <span class="h-badge-dot"></span>
            <span data-i18n="b3"></span>
          </div>
        </div>

      </div>
    </div>
  </section>

  <!-- Features Section with Scroll Reveal -->
  <section class="block alt" id="features">
    <div class="wrap">
      <div class="head reveal">
        <h2 data-i18n-html="fTitle"></h2>
        <p data-i18n="fSub"></p>
      </div>
      <div class="grid">
        <!-- Feature 1: Calendar -->
        <div class="card reveal reveal-delay-1">
          <div class="ico">
            <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
          </div>
          <h3 data-i18n="f1t"></h3>
          <p data-i18n="f1d"></p>
        </div>
        <!-- Feature 2: Digital Invitations & Maps -->

          <div class="ico">
            <svg viewBox="0 0 24 24"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>

          <h3 data-i18n="f4t"></h3>
          <p data-i18n="f4d"></p>
        </div>
        <!-- Feature 5: Hospitality & Catering -->

          <div class="ico">
            <svg viewBox="0 0 24 24"><path d="M18 8h1a4 4 0 0 1 0 8h-1"/><path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"/><line x1="6" y1="1" x2="6" y2="4"/><line x1="10" y1="1" x2="10" y2="4"/><line x1="14" y1="1" x2="14" y2="4"/></svg>

          <h3 data-i18n="f5t"></h3>
          <p data-i18n="f5d"></p>
        </div>
        <!-- Feature 6: Premium Sponsorships -->
        <div class="card reveal reveal-delay-6">
          <div class="ico">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="7"/><polyline points="8.21 13.89 7 23 12 20 17 23 15.79 13.88"/></svg>
          </div>
          <h3 data-i18n="f6t"></h3>
          <p data-i18n="f6d"></p>
        </div>
      </div>
    </div>
  </section>

  <!-- How It Works Section with Scroll Reveal -->
  <section class="block" id="how">
    <div class="wrap">
      <div class="head reveal">
        <h2 data-i18n-html="hTitle"></h2>
      </div>
      <div class="steps">
        <div class="step reveal reveal-delay-1"><div class="num">1</div><h3 data-i18n="s1t"></h3><p data-i18n="s1d"></p></div>
        <div class="step reveal reveal-delay-2"><div class="num">2</div><h3 data-i18n="s2t"></h3><p data-i18n="s2d"></p></div>
        <div class="step reveal reveal-delay-3"><div class="num">3</div><h3 data-i18n="s3t"></h3><p data-i18n="s3d"></p></div>
      </div>
    </div>
  </section>

  <!-- Download Destination Section with Scroll Reveal -->
  <section class="block" id="download" style="padding-top:0">
    <div class="wrap">
      <div class="cta reveal-scale">
        <h2 data-i18n-html="cTitle"></h2>
        <p data-i18n="cSub"></p>
        <div class="stores">

  let lang = "ar";
  const $ = s => document.querySelector(s);
  const $$ = s => document.querySelectorAll(s);

  function render(){
    const t = TEXT[lang];
    document.documentElement.lang = lang;
    document.documentElement.dir = t.dir;
    $$("[data-i18n]").forEach(el => el.textContent = t[el.dataset.i18n]);
    $$("[data-i18n-html]").forEach(el => el.innerHTML = t[el.dataset.i18nHtml]);
    $("#langBtn").textContent = t.btn;
    document.title = lang === "ar" ? "مناسبات الكويت – تطبيق مناسبات وأفراح القبائل والعوائل" : "Kuwait Occasions – Events & Tribal Gatherings App";
  }

  $("#langBtn").addEventListener("click", () => { lang = lang === "ar" ? "en" : "ar"; render(); });

  if (CONFIG.LOGO_URL) $("#logoImg").src = CONFIG.LOGO_URL;

  /* Store buttons - kept without external links */
  $$(".store").forEach(el => {
    el.removeAttribute("href");
    el.addEventListener("click", e => {
      e.preventDefault();
    });
  });

  /* Intersection Observer for Smooth Scroll Reveal Animations */
  const revealObserver = new IntersectionObserver((entries, obs) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        entry.target.classList.add('revealed');
        obs.unobserve(entry.target);
      }
    });
  }, {
    threshold: 0.08,
    rootMargin: "0px 0px -25px 0px"
  });

  document.querySelectorAll('.reveal, .reveal-scale').forEach(el => {
    revealObserver.observe(el);
  });

  render();
